name = "adigunaibible-account-preview"
main = "cloudflare/index.mjs"
compatibility_date = "2026-11-22"
workers_dev = true
preview_urls = false

[vars]
PRODUCT_ACCOUNT_PREFIX = "adigunaibible_preview"

[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = ["/api/account"]

[[ratelimits]]
name = "ACCOUNT_LIMITER"
namespace_id = "1"
simple = { limit = 10, period = 60 }

name = "adigunaibible-account-preview"
main = "cloudflare/index.mjs"
compatibility_date = "2026-11-22"
workers_dev = true
preview_urls = false

[vars]
PRODUCT_ACCOUNT_PREFIX = "adigunaibible_preview"

[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = ["/api/account", "/api/reader-translation"]

[ai]
binding = "AI"

[[ratelimits]]
name = "TRANSLATION_LIMITER"
namespace_id = "3"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "ACCOUNT_LIMITER"
namespace_id = "1"
simple = { limit = 10, period = 60 }

[env.production]
name = "adigunaibible-product"
workers_dev = false
preview_urls = false
routes = [{ pattern = "adigun-aibible.hephzibahbehulah.com/*", zone_name = "hephzibahbehulah.com" }]

[env.production.vars]
PRODUCT_ACCOUNT_PREFIX = "adigunaibible"

[env.production.assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = ["/api/account", "/api/reader-translation"]

[env.production.ai]
binding = "AI"

[[env.production.ratelimits]]
name = "TRANSLATION_LIMITER"
namespace_id = "4"
simple = { limit = 5, period = 60 }

[[env.production.ratelimits]]
name = "ACCOUNT_LIMITER"
namespace_id = "2"
simple = { limit = 10, period = 60 }

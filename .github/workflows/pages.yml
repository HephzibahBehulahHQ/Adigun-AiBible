- name: Verify the published source revision
  env:
    ADIGUN_DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
    ADIGUN_EXPECTED_COMMIT: ${{ github.sha }}
  run: |
    node --input-type=module <<'NODE'
    const base = process.env.ADIGUN_DEPLOYED_URL;
    const expected = process.env.ADIGUN_EXPECTED_COMMIT;
    if (!base || !/^[a-f0-9]{40}$/.test(expected || '')) throw new Error('Missing deployment identity.');

    const deployed = new URL(base);
    if (deployed.protocol !== 'https:' || deployed.hostname !== 'adigun-aibible.hephzibahbehulah.com' || deployed.pathname !== '/') {
      throw new Error('Unexpected deployment URL: ' + deployed.href);
    }

    const receipt = new URL('build-info.json', deployed);
    let failure;
    for (let attempt = 0; attempt < 12; attempt++) {
      try {
        receipt.searchParams.set('verify', expected + '-' + attempt);
        const response = await fetch(receipt, { cache: 'no-store', signal: AbortSignal.timeout(15000) });
        if (!response.ok) throw new Error('Receipt HTTP ' + response.status);

        const info = await response.json();
        if (info.sourceCommit !== expected) throw new Error('The public receipt has not reached this source revision.');

        const home = await fetch(deployed, { cache: 'no-store', signal: AbortSignal.timeout(15000) });
        if (!home.ok) throw new Error('Published application HTTP ' + home.status);

        console.log(JSON.stringify({
          url: deployed.href,
          sourceCommit: info.sourceCommit,
          buildVersion: info.buildVersion,
          contentVersion: info.contentVersion,
          verifiedAt: new Date().toISOString()
        }));
        failure = null;
        break;
      } catch (error) {
        failure = error;
        console.log('Publication verification attempt ' + (attempt + 1) + ': ' + error.message);
        if (attempt < 11) await new Promise(resolve => setTimeout(resolve, 5000));
      }
    }

    if (failure) throw failure;
    NODE
